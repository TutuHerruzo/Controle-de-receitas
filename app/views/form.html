{% extends 'base.html' %}

<!-- Muda o título dependendo se a receita existe ou não -->
{% block title %}{% if recipe %}Editar Receita{% else %}Nova Receita{% endif %}{% endblock %}

{% block content %}
<h2 style="margin-bottom: 20px;">{% if recipe %}Editar Receita{% else %}Cadastrar Nova Receita{% endif %}</h2>

<!-- Se houver uma receita, a action vai para a rota de edição. Se não, vai para a rota de criação -->
<form action="{{ url_for('recipe.edit_recipe', id=recipe.id) if recipe else url_for('recipe.create_recipe') }}" method="POST">
    
    <div class="form-group">
        <label for="title">Título da Receita *</label>
        <input type="text" id="title" name="title" required 
               value="{{ recipe.title if recipe else '' }}" placeholder="Ex: Bolo de Cenoura">
    </div>

    <div class="form-group">
        <label for="description">Descrição Breve (opcional)</label>
        <input type="text" id="description" name="description" 
               value="{{ recipe.description if recipe else '' }}" placeholder="Ex: Receita de família">
    </div>

    <div class="form-group">
        <label for="ingredients">Ingredientes *</label>
        <textarea id="ingredients" name="ingredients" rows="5" required 
                  style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">{{ recipe.ingredients if recipe else '' }}</textarea>
    </div>

    <div class="form-group">
        <label for="instructions">Modo de Preparo *</label>
        <textarea id="instructions" name="instructions" rows="6" required 
                  style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">{{ recipe.instructions if recipe else '' }}</textarea>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn" style="background-color: #28a745;">Salvar Receita</button>
        <a href="{{ url_for('main.dashboard') }}" class="btn" style="background-color: #6c757d; text-align: center;">Cancelar</a>
    </div>

    <div class="form-group">
        <label for="category_id">Categoria</label>
        <select name="category_id" id="category_id" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="">Sem Categoria</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if recipe and recipe.category_id == cat.id %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>
    </div>
</form>
{% endblock %}
